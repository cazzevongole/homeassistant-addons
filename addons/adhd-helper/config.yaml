name: "ADHD Helper"
version: "1.2.0"
slug: adhd_helper
description: "ADHD productivity tool with tasks, focus timer, planner, habits, and notes."
arch:
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 3000
ingress_stream: false
panel_icon: mdi:brain
panel_title: ADHD Helper
hassio_api: false
homeassistant_api: false
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Web UI (Not required for Ingress)"
url: "https://github.com/cazzevongole/homeassistant-addons"
