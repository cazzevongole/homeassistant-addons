name: Sync to HA Addon Repo
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/checkout@v4
        with:
          repository: cazzevongole/homeassistant-addons
          token: ${{ secrets.HA_ADDON_TOKEN }}
          path: addon

      - name: Sync app files
        run: |
          rm -rf addon/addons/adhd-helper/app
          rm -rf addon/addons/adhd-helper/components
          rm -rf addon/addons/adhd-helper/db
          rm -rf addon/addons/adhd-helper/lib
          rm -rf addon/addons/adhd-helper/public
          rm -f addon/addons/adhd-helper/package.json
          rm -f addon/addons/adhd-helper/package-lock.json
          rm -f addon/addons/adhd-helper/tsconfig.json
          rm -f addon/addons/adhd-helper/drizzle.config.ts
          rm -f addon/addons/adhd-helper/next.config.ts
          rm -rf addon/addons/adhd-helper/.next
          rm -rf addon/addons/adhd-helper/node_modules
          rm -f addon/addons/adhd-helper/*.db

          mkdir -p addon/addons/adhd-helper/app
          mkdir -p addon/addons/adhd-helper/components
          mkdir -p addon/addons/adhd-helper/db
          mkdir -p addon/addons/adhd-helper/lib
          mkdir -p addon/addons/adhd-helper/public

          cp -r app/app/* addon/addons/adhd-helper/app/
          cp -r app/components/* addon/addons/adhd-helper/components/
          cp -r app/db/* addon/addons/adhd-helper/db/
          cp -r app/lib/* addon/addons/adhd-helper/lib/
          cp -r app/public/* addon/addons/adhd-helper/public/
          cp app/package.json addon/addons/adhd-helper/
          cp app/package-lock.json addon/addons/adhd-helper/
          cp app/tsconfig.json addon/addons/adhd-helper/
          cp app/drizzle.config.ts addon/addons/adhd-helper/
          cp app/next.config.ts addon/addons/adhd-helper/

      - name: Commit and push changes
        run: |
          cd addon
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync from adhd-helper app repo (${{ github.sha }})"
            git push
          fi
